# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/" # root reactor: root pom + extension (the only module in <modules>)
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    cooldown:
      semver-patch-days: 5
    # examples/ is intentionally not scanned here - it's not part of <modules>
    # and its parent version has drifted from extension's, so it isn't part of
    # the active build.

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "actions/*"
      third-party-actions:
        patterns:
          - "*"
